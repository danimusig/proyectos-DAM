<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Catálogo de Productos</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body>
    <main class="mainContent">
       <form action="" id="contactForm">
            <fieldset id = fieldSet">
                <legend>Carga</legend>
            </fieldset>
            <fieldset>
                <legend>Insertar</legend>
                <div class="inputContainer">
                    <label for="txtCategoriaInsertar">Título de clasificación:</label>
                    <input type="text" id="txtCategoriaInsertar" placeholder="Clasificacion">
                    <label for="txtProductoInsertar">Producto:</label>
                    <input type="text" id="txtProductoInsertar" placeholder="Producto">
                </div>
                
                <button type="button" id="btnInsertar">Insertar</button>
            </fieldset>
            <fieldset>
                <legend>Editar</legend>
                <div class="inputContainer">
                    <label for="txtIdEditar">Título de clasificación:</label>
                    <input type="text" id="txtClasificacionEditar" placeholder="Clasificacion">
                    <label for="txtProductoEditar">Producto:</label>
                    <input type="text" id="txtProductoEditar" placeholder="Producto">
                </div>
                <button type="button" id="btnEditar">Editar</button>
            </fieldset>
       </form> 
    </main>
</body>
