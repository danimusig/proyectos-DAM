<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/estilos.css">
        <title>Document</title>
    </head>
    
    <body>
        <section>
            <fieldset class="cargar">
                <legend> Cargar </legend>
                <div class="listaCargar"></div>
            </fieldset>

            <fieldset class="insertar">
                <legend> Insertar </legend>
                <label for="titulo"> Titulo de clasificación </label>
                <input id="titulo" placeholder="Titulo"/>
                <label for="producto"> Producto </label>
                <input id="producto" placeholder="Producto"/>   
                <div class="listaCargar"></div>
                <button class="btInsertar"> Insertar </button>
            </fieldset>

            <fieldset class="editar">
                <legend> Editar </legend>
                <label for="tituloEditar"> Titulo de clasificación </label>
                <input id="tituloEditar" placeholder="Titulo"/>
                <label for="productoEditar"> Producto </label>
                <input id="productoEditar" placeholder="Producto"/>   
                <div class="listaEditar"></div>
                <button class="btInsertar"> Editar </button>
            </fieldset>
            <script src="js/index.js"></script>
        </section>
    </body>
</html>
